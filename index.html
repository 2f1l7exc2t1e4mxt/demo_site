    <!--
      GitHub Pages は静的ホスティングのためサーバー側でのパス書き換えができない。
      404.html からのリダイレクトで一時的にクエリ文字列化されたパスを、
      React Router がマウントされる前に本来のパスへ復元する（spa-github-pages方式）。
    -->
    <script type="text/javascript" async="" src="https://www.googletagmanager.com/gtag/js?id=G-20GS8Z38KY&amp;cx=c&amp;gtm=4e6bh1"></script><script async="" src="https://www.googletagmanager.com/gtm.js?id=GTM-TPVG273L"></script><script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <!--
      Google Consent Mode v2 — GTMコンテナより先に読み込み、既定値を「保存拒否」にする。
      同意バナー（ConsentBanner.jsx）でユーザーが選択するまでCookie/分析ストレージへの
      書き込みは行われない（gtag('consent', 'update', ...)で選択結果を反映）。
    -->
    <script type="text/javascript">
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });
    </script>

    <!--
      user_idはGTMの構成パラメータ（Fields to Set）で読み込むため、GTMコンテナが
      発火するより前にdataLayerへ積んでおく必要がある。SPAの疑似遷移中の状態変化は
      拾えない（Enhanced MeasurementのSPA内自動page_viewはGTMのトリガーを経由せず
      構成パラメータが反映されないため）ので、ログイン切り替え（LoginToggle.jsx）は
      localStorageへ保存した上でページを実リロードし、ここで最新状態を読み直す。
    -->
    <script type="text/javascript">
      window.dataLayer.push({
        user_id: window.localStorage.getItem('ga4_demo_login') === 'true' ? 'usr_8f3a1c20' : null,
      });
    </script>

    <!--
      GA4はgtag.js直書きではなく、Google Tag Manager (GTM-TPVG273L) 経由で配信する。
      Googleタグ（測定ID: G-20GS8Z38KY、All Pagesトリガー、構成パラメータ
      user_id={{uid}}）はGTMコンテナ側で設定する。
    -->
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TPVG273L');</script>
    <!-- End Google Tag Manager -->

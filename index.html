<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ga4_web_demo</title>
    <link rel="stylesheet" href="style.css" />

    <!--
      Google Consent Mode v2 — GTMコンテナより先に読み込み、既定値を「保存拒否」にする。
      同意バナー（common.js）でユーザーが選択するまでCookie/分析ストレージへの
      書き込みは行われない（gtag('consent', 'update', ...)で選択結果を反映）。
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });
    </script>

    <!--
      user_idはGTMの構成パラメータで読み込むため、GTMコンテナが発火するより前に
      dataLayerへ積んでおく。ログイン切替（common.js）はlocalStorageへ保存した上で
      ページを実リロードし、ここで最新状態を読み直す。
    -->
    <script>
      window.dataLayer.push({
        user_id: window.localStorage.getItem('ga4_demo_login') === 'true' ? 'usr_8f3a1c20' : null,
      });
    </script>

    <!--
      GA4とData 360のタグは、いずれもGTM経由で配信する。
      タグはGTMコンテナ側で設定するため、ここには直書きしない。
    -->
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TPVG273L');</script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TPVG273L"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <main class="app">
      <div id="site-header"></div>

      <section>
        <h1>GA4 検証サイト</h1>
        <p>商品一覧から詳細ページに遷移して、GA4標準イベントの送信を確認します。</p>

        <form id="search-form">
          <label for="keyword">サイト内検索</label>
          <input id="keyword" name="keyword" type="text" placeholder="車種名で検索" />
          <button type="submit">検索</button>
        </form>

        <ul id="product-list"></ul>

        <p><a href="contact.html">お問い合わせはこちら</a></p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="home.js"></script>
  </body>
</html>

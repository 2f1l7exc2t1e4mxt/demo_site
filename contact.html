<html lang="ja">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      window.dataLayer.push({

    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TPVG273L"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <main class="app">
      <div id="site-header"></div>

      <section>
        <h1>お問い合わせ</h1>
        <p>検証用のフォームです。送信すると、氏名・電話番号・メールアドレスがData 360へ送られます。</p>

        <form id="contact-form" class="contact-form" novalidate>
          <label for="lastName">姓</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />

          <label for="firstName">名</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />

          <label for="phone">電話番号</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="090-1234-5678" required />

          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <button type="submit">送信する</button>
        </form>

        <p id="contact-result" role="status"></p>
        <p><a href="index.html">一覧に戻る</a></p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="contact.js"></script>
  </body>
</html>
